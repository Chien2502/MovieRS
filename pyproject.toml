[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviers"
version = "2.0.0"
description = "Quy trình nghiên cứu và ứng dụng khuyến nghị phim MovieRS"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["src*", "api*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
moviers-research = "src.experiments.__main__:main"
